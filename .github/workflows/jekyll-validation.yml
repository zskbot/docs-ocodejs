name: Jekyll build validation

# This imported repository includes API reference Markdown with Liquid-like tags
# (for example `{% data %}`) that are not valid Jekyll tags. Keep this legacy
# Jekyll diagnostic manual-only; GitHub Pages is deployed by static.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Build with Jekyll (validation only; no deployment)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site-validation-output
