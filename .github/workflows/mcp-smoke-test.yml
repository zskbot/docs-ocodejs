name: Documentation MCP smoke test

on:
  pull_request:
    paths:
      - "scripts/smoke-test-mcp.py"
      - "cloudflare/ocodejs-docs-mcp/**"
      - ".github/workflows/mcp-smoke-test.yml"
      - ".github/workflows/static.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/smoke-test-mcp.py"
      - "cloudflare/ocodejs-docs-mcp/**"
      - ".github/workflows/mcp-smoke-test.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Verify read-only MCP HTTP and protocol
        env:
          MCP_URL: https://ocodejs-docs-mcp.velclaw.workers.dev
        run: python3 scripts/smoke-test-mcp.py
