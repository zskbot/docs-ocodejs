name: Service inventory validation

on:
  pull_request:
    paths:
      - "ecosystem/services.json"
      - "scripts/validate-services.py"
      - ".github/workflows/service-inventory-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "ecosystem/services.json"
      - "scripts/validate-services.py"
      - ".github/workflows/service-inventory-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-inventory-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/validate-services.py
      - name: Validate service registry
        run: python3 scripts/validate-services.py
