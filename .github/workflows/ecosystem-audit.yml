name: Ecosystem documentation audit

on:
  workflow_dispatch:
  # One-time branch-scoped run to collect metadata without publishing the raw documentation corpus.
  push:
    branches:
      - ops/run-safe-ecosystem-audit
    paths:
      - .github/workflows/ecosystem-audit.yml
      - scripts/audit-ecosystem.py

permissions:
  contents: read

concurrency:
  group: ecosystem-doc-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inventory repositories and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout documentation hub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run read-only source audit
        run: python3 scripts/audit-ecosystem.py
      - name: Upload reviewed metadata only
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: ecosystem-documentation-audit-metadata
          path: |
            audit-output/summary.md
            audit-output/manifest.csv
          if-no-files-found: error
          retention-days: 3
