name: Ecosystem documentation audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-doc-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inventory repositories and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout documentation hub
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Run read-only source audit
        run: python3 scripts/audit-ecosystem.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (Node.js 24)
        with:
          name: ecosystem-documentation-audit
          path: |
            audit-output/summary.md
            audit-output/manifest.csv
          if-no-files-found: error
          retention-days: 3
