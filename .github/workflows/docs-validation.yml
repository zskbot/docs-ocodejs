name: Documentation validation

on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - "index.html"
      - "scripts/check-doc-html.py"
      - "scripts/check-doc-links.py"
      - "scripts/audit-ecosystem.py"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.mdx"
      - "index.html"
      - "scripts/check-doc-html.py"
      - "scripts/check-doc-links.py"
      - "scripts/audit-ecosystem.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Check Python syntax
        run: python3 -m py_compile scripts/check-doc-links.py scripts/audit-ecosystem.py
      - name: Validate local Markdown links
        run: python3 scripts/check-doc-links.py
      - name: Validate homepage HTML structure
        run: python3 scripts/check-doc-html.py
