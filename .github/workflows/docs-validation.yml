name: Documentation validation

on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - "index.html"
      - "scripts/check-doc-html.py"
      - "scripts/check-doc-links.py"
      - ".github/workflows/docs-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "**.mdx"
      - "index.html"
      - "scripts/check-doc-html.py"
      - "scripts/check-doc-links.py"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Python syntax
        run: python3 -m py_compile scripts/check-doc-links.py scripts/audit-ecosystem.py
      - name: Validate local Markdown links
        run: python3 scripts/check-doc-links.py
      - name: Validate homepage HTML structure
        run: python3 scripts/check-doc-html.py
